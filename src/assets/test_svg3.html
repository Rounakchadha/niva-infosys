<!DOCTYPE html>
<html>
<body style="background: black; color: white; padding: 50px;">
  <svg viewBox="0 0 140 40" width="400" fill="currentColor">
    <g transform="translate(10, 5) skewX(-20)">
      <!-- Use a nested svg to clip the strokes at y=0 and y=30 -->
      <svg x="0" y="0" width="140" height="30" viewBox="0 0 140 30" overflow="hidden">
        <g fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="miter" stroke-miterlimit="10">
          <!-- N -->
          <polyline points="4,30 4,0 20,30 20,0" />
          <!-- I -->
          <line x1="32" y1="0" x2="32" y2="30" />
          <!-- VA -->
          <polyline points="44,0 60,30 76,0 92,30" />
        </g>
        <!-- Wave -->
        <path d="M 66,16 Q 80,16, 92,24 Q 100,28, 108,14 Q 100,32, 88,26 Q 78,21, 66,22 Z" fill="currentColor" />
      </svg>
    </g>
  </svg>
</body>
</html>
